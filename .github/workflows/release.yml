name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Commits pushed straight to main never close a pull request, so they would
  # otherwise never be released -- the app changes in 8df2ba1 sat unreleased
  # for exactly this reason. This allows cutting a release from main on demand.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

# Releases mutate main (version bump + tag), so they must never run in
# parallel. Without this, merging several PRs in quick succession makes every
# release job read the same package.json, compute the same version, and race
# to push -- all but one fail with "Expected branch to point to <sha>".
# A fixed group name serializes across PRs; github.ref would not, since each
# pull_request event carries its own refs/pull/N/merge ref.
# cancel-in-progress stays false: cancelling mid-run could leave a pushed tag
# with no matching release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'patch') ||
        contains(github.event.pull_request.labels.*.name, 'minor') ||
        contains(github.event.pull_request.labels.*.name, 'major')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine bump type
        id: bump
        run: |
          # Dependabot labels a PR with the DEPENDENCY's semver change, not the
          # app's -- a React 18 -> 19 bump arrives labelled `major` and would
          # otherwise release v2.0.0 of this app. Dependency updates are never
          # a breaking change to the app's own public surface, so they always
          # release as a patch. Deliberate minor/major releases come from
          # hand-labelled PRs, which do not carry the `dependencies` label.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.bump }}" >> $GITHUB_OUTPUT
          elif ${{ contains(github.event.pull_request.labels.*.name, 'dependencies') }}; then
            echo "type=patch" >> $GITHUB_OUTPUT
          elif ${{ contains(github.event.pull_request.labels.*.name, 'major') }}; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        run: npm version ${{ steps.bump.outputs.type }} --no-git-tag-version

      - name: Get new version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Install dependencies
        # See the note in build.yml. The published bundle is built from this
        # install, so blocking lifecycle hooks matters most here.
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build
        run: yarn build

      # Runs before the tag and release are published, so a failing test
      # aborts the release instead of shipping a broken bundle. Must run
      # after Build -- see the note in build.yml.
      - name: Test
        run: yarn test

      - name: Commit and tag
        uses: planetscale/ghcommit-action@v0.2.22
        with:
          commit_message: "chore: release v${{ steps.version.outputs.value }}"
          repo: ${{ github.repository }}
          branch: main
          file_pattern: package.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release
        run: |
          git fetch origin main
          git tag "v${{ steps.version.outputs.value }}" origin/main
          git push origin "v${{ steps.version.outputs.value }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          files: build/bundle/*.zip
          generate_release_notes: true
