name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Without this the job inherits the repository default, which is write.
    # Building and testing only ever needs to read the checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        # --ignore-scripts blocks package lifecycle hooks, the primary code
        # execution path for npm supply-chain attacks. Only 3 of ~773 packages
        # in this tree declare one (core-js-pure: a donation message,
        # esbuild: binary provisioning, ljharb-monorepo-symlink-test), and
        # none are load-bearing -- esbuild resolves its binary from
        # optionalDependencies (@esbuild/linux-x64).
        # If a future dependency genuinely needs a hook, the build fails
        # loudly here rather than silently executing it.
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build
        run: yarn build

      # Must run after Build: src/App.jsx imports ./locales, which is
      # gitignored and generated by d2-app-scripts. On a fresh checkout the
      # import cannot resolve until a build has run once.
      - name: Test
        run: yarn test

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: security-auditor-app
          path: build/bundle/*.zip
          retention-days: 30
