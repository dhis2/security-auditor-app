name: Dependency-Track

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # cdxgen is the CycloneDX project's own generator. It reads yarn.lock
      # directly, so no `yarn install` is needed and the SBOM carries the exact
      # pinned versions plus a full dependency graph.
      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen@11.11.0 -t js -o bom.json --no-recurse .

      - name: Upload SBOM to DependencyTrack
        env:
          # DEPENDENCYTRACK_URL already includes the full /api/v1/bom path.
          # Resolved from either context, since it may be stored as a repo
          # variable or as a secret.
          DEPENDENCY_TRACK_API: ${{ vars.DEPENDENCYTRACK_URL || secrets.DEPENDENCYTRACK_URL }}
          DT_API_KEY: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
        run: |
          if [ -z "$DEPENDENCY_TRACK_API" ]; then
            echo "::error::DEPENDENCYTRACK_URL is not set as a repo variable or secret"
            exit 1
          fi
          curl -X POST "$DEPENDENCY_TRACK_API" \
              --fail-with-body \
              -H "X-Api-Key: $DT_API_KEY" \
              -F "autoCreate=true" \
              -F "projectName=${{ github.event.repository.name }}" \
              -F "projectVersion=${{ github.ref_name }}" \
              -F "bom=@bom.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json
          retention-days: 30
